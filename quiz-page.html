<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Full Mark | الامتحان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Readex Pro', sans-serif; background-color: #020617; }
        .option-btn { background: #1e293b; border: 1px solid #334155; transition: 0.2s; }
        .option-btn:hover { border-color: #fbbf24; }
        .selected { background: #fbbf24 !important; color: #020617 !important; font-weight: bold; border-color: #fbbf24; }
    </style>
</head>
<body class="text-white p-4">
    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between p-6 bg-slate-900 rounded-2xl mb-6 border border-slate-800">
            <div id="timer" class="text-2xl font-bold text-amber-500">50:00</div>
            <div id="progress" class="text-slate-400">سؤال 1 من 20</div>
        </div>

        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl">
            <img id="q-img" src="" class="hidden w-full max-h-64 object-contain mb-6 rounded-xl border border-slate-700">
            <h2 id="q-text" class="text-2xl font-bold mb-8 leading-relaxed">جاري التحميل...</h2>
            
            <div id="options" class="grid gap-4"></div>

            <div class="flex justify-between mt-10">
                <button onclick="prev()" class="px-8 py-3 bg-slate-800 rounded-xl">السابق</button>
                <button onclick="next()" id="next-btn" class="px-8 py-3 bg-amber-500 text-slate-900 font-bold rounded-xl">التالي</button>
            </div>
        </div>
    </div>

    <script>
        const questions = JSON.parse(localStorage.getItem('currentExam'));
        let currentIndex = 0;
        let answers = new Array(questions.length).fill(null);
        let time = 50 * 60;

        const timerEl = document.getElementById('timer');
        setInterval(() => {
            if(time <= 0) finish();
            time--;
            let m = Math.floor(time/60);
            let s = time%60;
            timerEl.innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);

        function render() {
            const q = questions[currentIndex];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('progress').innerText = `سؤال ${currentIndex + 1} من ${questions.length}`;
            
            const img = document.getElementById('q-img');
            if(q.img) { img.src = q.img; img.classList.remove('hidden'); }
            else { img.classList.add('hidden'); }

            let html = '';
            q.options.forEach((opt, i) => {
                const selClass = answers[currentIndex] === i ? 'selected' : '';
                html += `<button onclick="select(${i})" class="option-btn text-right p-5 rounded-xl ${selClass}">${opt}</button>`;
            });
            document.getElementById('options').innerHTML = html;
            document.getElementById('next-btn').innerText = currentIndex === questions.length - 1 ? 'إنهاء' : 'التالي';
        }

        function select(i) { answers[currentIndex] = i; render(); }
        function next() { if(currentIndex < questions.length - 1) { currentIndex++; render(); } else finish(); }
        function prev() { if(currentIndex > 0) { currentIndex--; render(); } }

        function finish() {
            localStorage.setItem('userAnswers', JSON.stringify(answers));
            window.location.href = 'result.html';
        }
        render();
    </script>
</body>
</html>
