<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark | الامتحان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .selected { background: #f59e0b !important; color: #020617 !important; border-color: #f59e0b !important; font-weight: bold; }
        .grid-ans { background: #f59e0b; color: #020617; }
        .grid-skip { background: #ef4444; color: white; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="bg-slate-950 text-white font-['Readex_Pro'] min-h-screen">

    <div id="modal">
        <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold mb-4 text-amber-500">عارفين إنك شاطر.. 🌟</h2>
            <p class="text-slate-400 mb-8 text-sm">راجع إجاباتك كويس قبل ما تسلم، بالتوفيق يا بطل!</p>
            <div class="flex gap-4">
                <button onclick="document.getElementById('modal').style.display='none'" class="flex-1 py-3 bg-slate-800 rounded-xl">رجوع</button>
                <button onclick="finalSubmit()" class="flex-1 py-3 bg-amber-500 text-slate-900 font-bold rounded-xl">تسليم</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <div class="flex justify-between items-center p-4 md:p-6 bg-slate-900 rounded-2xl mb-6 border border-slate-800">
            <div id="timer" class="text-xl md:text-2xl font-bold text-amber-500">50:00</div>
            <div id="prog" class="text-sm md:text-base text-slate-400 font-bold">1 / 20</div>
        </div>

        <div class="bg-slate-900 p-6 md:p-10 rounded-[2.5rem] border border-slate-800 shadow-2xl relative">
            <h2 id="q" class="text-xl md:text-2xl font-bold mb-8 leading-relaxed"></h2>
            <div id="opts" class="grid gap-3"></div>
            <div class="flex justify-between mt-10">
                <button onclick="prev()" class="px-6 md:px-10 py-3 bg-slate-800 rounded-xl font-bold">السابق</button>
                <button onclick="next()" id="next-btn" class="px-6 md:px-10 py-3 bg-amber-500 text-slate-900 font-bold rounded-xl">التالي</button>
            </div>
        </div>

        <div class="mt-8 p-6 bg-slate-900 rounded-3xl border border-slate-800">
            <h3 class="text-xs font-bold text-slate-500 mb-4 text-center">خريطة الأسئلة (بابل شيت)</h3>
            <div id="grid" class="flex flex-wrap justify-center gap-2"></div>
            <button id="submit-btn" disabled onclick="document.getElementById('modal').style.display='flex'" class="w-full mt-8 py-4 bg-slate-800 text-slate-500 rounded-2xl font-black transition-all cursor-not-allowed">
                تسليم الامتحان
            </button>
        </div>
    </div>

    <script>
        const exam = JSON.parse(localStorage.getItem('currentExam'));
        let idx = 0; let ans = new Array(exam.questions.length).fill(null);
        let vis = new Array(exam.questions.length).fill(false); vis[0] = true;
        let time = 50 * 60;

        setInterval(() => {
            if(time <= 0) finalSubmit();
            time--; let m = Math.floor(time/60); let s = time%60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);

        function show() {
            const curr = exam.questions[idx];
            document.getElementById('q').innerText = curr.q;
            document.getElementById('prog').innerText = `${idx + 1} / ${exam.questions.length}`;
            let h = '';
            curr.options.forEach((o, i) => {
                h += `<button onclick="sel(${i})" class="w-full text-right p-4 rounded-xl border border-slate-800 bg-slate-950/40 ${ans[idx] === i ? 'selected' : ''}">${i+1}- ${o}</button>`;
            });
            document.getElementById('opts').innerHTML = h;
            renderGrid();
            check();
        }

        function renderGrid() {
            let h = '';
            for(let i=0; i<exam.questions.length; i++) {
                let c = 'bg-slate-800 text-slate-500';
                if(ans[i] !== null) c = 'grid-ans'; else if(vis[i]) c = 'grid-skip';
                let active = (i === idx) ? 'ring-2 ring-white scale-110' : '';
                h += `<div class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-bold ${c} ${active}">${i+1}</div>`;
            }
            document.getElementById('grid').innerHTML = h;
        }

        function check() {
            const done = ans.every(a => a !== null);
            const b = document.getElementById('submit-btn');
            if(done) { b.disabled = false; b.classList.replace('bg-slate-800', 'bg-green-600'); b.classList.replace('text-slate-500', 'text-white'); b.classList.remove('cursor-not-allowed'); }
        }

        function sel(i) { ans[idx] = i; show(); }
        function next() { if(idx < exam.questions.length - 1) { idx++; vis[idx] = true; show(); } }
        function prev() { if(idx > 0) { idx--; show(); } }
        function finalSubmit() { localStorage.setItem('results', JSON.stringify(ans)); window.location.href = 'result.html'; }
        show();
    </script>
</body>
</html>
