<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Full Mark | الامتحان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .selected { background: #f59e0b !important; color: #020617 !important; border-color: #f59e0b !important; }
    </style>
</head>
<body class="bg-slate-950 text-white p-4 font-['Readex_Pro']">
    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between p-6 bg-slate-900 rounded-2xl mb-6 border border-slate-800">
            <div id="timer" class="text-2xl font-bold text-amber-500">50:00</div>
            <div id="prog" class="text-slate-400 font-bold">1 / 20</div>
        </div>
        <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl min-h-[400px]">
            <h2 id="q" class="text-2xl font-bold mb-10 leading-relaxed"></h2>
            <div id="opts" class="grid gap-4"></div>
            <div class="flex justify-between mt-12">
                <button onclick="prev()" class="px-8 py-3 bg-slate-800 rounded-2xl font-bold hover:bg-slate-700">السابق</button>
                <button onclick="next()" id="btn" class="px-8 py-3 bg-amber-500 text-slate-900 font-bold rounded-2xl">التالي</button>
            </div>
        </div>
    </div>
    <script>
        const exam = JSON.parse(localStorage.getItem('currentExam'));
        let idx = 0;
        let ans = new Array(exam.questions.length).fill(null);
        let time = 50 * 60;

        setInterval(() => {
            if(time <= 0) finish();
            time--;
            let m = Math.floor(time/60); let s = time%60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);

        function show() {
            const curr = exam.questions[idx];
            document.getElementById('q').innerText = curr.q;
            document.getElementById('prog').innerText = `${idx + 1} / ${exam.questions.length}`;
            let html = '';
            curr.options.forEach((o, i) => {
                html += `<button onclick="sel(${i})" class="w-full text-right p-5 rounded-2xl border border-slate-800 bg-slate-950/50 hover:border-amber-500 transition-all ${ans[idx] === i ? 'selected' : ''}">${i+1}- ${o}</button>`;
            });
            document.getElementById('opts').innerHTML = html;
            document.getElementById('btn').innerText = idx === exam.questions.length - 1 ? 'إنهاء' : 'التالي';
        }

        function sel(i) { ans[idx] = i; show(); }
        function next() { if(idx < exam.questions.length - 1) { idx++; show(); } else finish(); }
        function prev() { if(idx > 0) { idx--; show(); } }
        function finish() { localStorage.setItem('results', JSON.stringify(ans)); window.location.href = 'result.html'; }
        show();
    </script>
</body>
</html>
