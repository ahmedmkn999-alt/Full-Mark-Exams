<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النتيجة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white p-4 md:p-8 font-['Readex_Pro']">
    <div class="max-w-3xl mx-auto text-center">
        <div class="p-8 md:p-12 bg-slate-900 rounded-[3rem] border border-slate-800 mb-8">
            <h1 class="text-xl md:text-2xl font-bold text-amber-500 mb-4">درجتك النهائية</h1>
            <div id="score" class="text-7xl md:text-9xl font-black mb-4">0</div>
            <p id="msg" class="text-slate-400 font-bold"></p>
        </div>
        <div id="review" class="space-y-4 text-right"></div>
        <button onclick="location.href='index.html'" class="mt-10 w-full py-4 bg-amber-500 text-slate-900 font-bold rounded-2xl">العودة للرئيسية</button>
    </div>
    <script>
        const ex = JSON.parse(localStorage.getItem('currentExam'));
        const u = JSON.parse(localStorage.getItem('results'));
        let s = 0; let h = '';
        ex.questions.forEach((q, i) => {
            const correct = u[i] === q.correct; if(correct) s++;
            h += `
                <div class="p-6 rounded-2xl border ${correct ? 'border-green-900/50 bg-green-950/20' : 'border-red-900/50 bg-red-950/20'}">
                    <p class="font-bold mb-3">${i+1}- ${q.q}</p>
                    <p class="text-sm ${correct ? 'text-green-500' : 'text-red-500'} font-bold">إجابتك: ${q.options[u[i]]}</p>
                    ${!correct ? `<p class="text-sm text-green-500 font-bold">الصح: ${q.options[q.correct]}</p>` : ''}
                    <p class="mt-3 text-xs text-slate-500 p-2 bg-slate-900/50 rounded-lg">💡 التفسير: ${q.hint}</p>
                </div>`;
        });
        document.getElementById('score').innerText = `${s}/${ex.questions.length}`;
        document.getElementById('review').innerHTML = h;
    </script>
</body>
</html>
