<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>النتيجة النهائية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Readex Pro', sans-serif; background-color: #020617; color: white; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl font-bold text-amber-500 mb-4">انتهى الامتحان! 🏆</h1>
        <div id="score" class="text-7xl font-black mb-10">0 / 20</div>
        
        <h3 class="text-2xl font-bold mb-6 text-right">مراجعة الإجابات:</h3>
        <div id="review" class="space-y-4 text-right"></div>
        
        <button onclick="location.href='index.html'" class="mt-10 px-10 py-4 bg-white text-black font-bold rounded-2xl">العودة للرئيسية</button>
    </div>

    <script>
        const questions = JSON.parse(localStorage.getItem('currentExam'));
        const userAnswers = JSON.parse(localStorage.getItem('userAnswers'));
        let score = 0;
        let html = '';

        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if(isCorrect) score++;
            
            html += `
                <div class="p-6 rounded-2xl ${isCorrect ? 'bg-green-500/10 border border-green-500' : 'bg-red-500/10 border border-red-500'}">
                    <p class="font-bold mb-2">${i+1}- ${q.q}</p>
                    <p class="text-sm">إجابتك: <span class="${isCorrect ? 'text-green-500' : 'text-red-500'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'لم تجب'}</span></p>
                    ${!isCorrect ? `<p class="text-sm text-green-500">الإجابة الصحيحة: ${q.options[q.correct]}</p>` : ''}
                    <p class="mt-2 text-xs text-slate-400 bg-slate-800 p-2 rounded">💡 التفسير: ${q.hint}</p>
                </div>
            `;
        });

        document.getElementById('score').innerText = `${score} / ${questions.length}`;
        document.getElementById('review').innerHTML = html;
    </script>
</body>
</html>
