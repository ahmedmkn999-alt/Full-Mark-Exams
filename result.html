<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>النتيجة النهائية | Full Mark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white p-6 font-['Readex_Pro']">
    <div class="max-w-4xl mx-auto text-center">
        <div class="mb-10 p-10 bg-slate-900 rounded-[3rem] border border-slate-800 shadow-2xl">
            <h1 class="text-3xl font-bold text-amber-500 mb-6">نتيجة الامتحان الشامل</h1>
            <div id="score-box" class="text-8xl font-black mb-4 tracking-tighter text-white">0</div>
            <p id="feedback" class="text-slate-400 text-xl font-bold"></p>
        </div>

        <h2 class="text-2xl font-bold mb-8 text-right border-r-4 border-amber-500 pr-4">مراجعة الأسئلة والإجابات:</h2>
        <div id="review-list" class="space-y-6 text-right pb-20"></div>

        <button onclick="location.href='index.html'" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-12 py-4 bg-amber-500 text-slate-900 font-black rounded-2xl shadow-2xl hover:scale-105 transition-all">العودة للرئيسية</button>
    </div>

    <script>
        const exam = JSON.parse(localStorage.getItem('currentExam'));
        const userAns = JSON.parse(localStorage.getItem('results'));
        let score = 0;
        let html = '';

        exam.questions.forEach((q, i) => {
            const correctIdx = q.correct;
            const userIdx = userAns[i];
            const isCorrect = userIdx === correctIdx;
            if(isCorrect) score++;

            html += `
                <div class="p-8 rounded-[2rem] border ${isCorrect ? 'border-green-500/30 bg-green-500/5' : 'border-red-500/30 bg-red-500/5'}">
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-slate-800 px-4 py-1 rounded-full text-xs font-bold">${isCorrect ? '✅ صحيح' : '❌ خطأ'}</span>
                        <span class="font-bold text-lg">سؤال ${i+1}</span>
                    </div>
                    <p class="text-xl font-bold mb-6 leading-relaxed">${q.q}</p>
                    <div class="grid gap-2 mb-6">
                        <p class="p-4 rounded-xl bg-slate-900 border border-slate-800">إجابتك: <span class="${isCorrect ? 'text-green-500' : 'text-red-500'} font-bold">${q.options[userIdx]}</span></p>
                        ${!isCorrect ? `<p class="p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-500 font-bold">الإجابة الصحيحة: ${q.options[correctIdx]}</p>` : ''}
                    </div>
                    <div class="p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl">
                        <p class="text-sm text-amber-500 leading-relaxed">💡 <span class="font-bold">التفسير:</span> ${q.hint}</p>
                    </div>
                </div>
            `;
        });

        document.getElementById('score-box').innerText = `${score} / ${exam.questions.length}`;
        document.getElementById('review-list').innerHTML = html;
        
        const percent = (score / exam.questions.length) * 100;
        const feedbackEl = document.getElementById('feedback');
        if(percent >= 85) feedbackEl.innerText = "ممتاز! أنت مشروع دكتور حقيقي 🩺";
        else if(percent >= 65) feedbackEl.innerText = "جيد جداً، ركز أكتر في المراجعة 📚";
        else feedbackEl.innerText = "محتاج تشد حيلك أكتر في الجزء ده ✍️";
    </script>
</body>
</html>
