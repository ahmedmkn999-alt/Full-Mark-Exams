<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark Exam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000; --card: #111111; --accent: #bb86fc; 
            --text: #ffffff; --secondary: #03dac6; --error: #cf6679;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { background: #0a0a0a; padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; }

        /* General Layout */
        .container { padding: 20px; max-width: 900px; margin: 0 auto; }
        .hidden { display: none !important; }
        
        /* Subject Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .card i { font-size: 2.5rem; color: var(--secondary); margin-bottom: 10px; }

        /* Exam Interface */
        .exam-box { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #333; }
        .option { display: block; background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .option:hover { background: #222; border-color: #444; }
        .timer { font-size: 1.2rem; color: var(--error); font-weight: bold; }
        
        /* Buttons */
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .back-btn { background: transparent; color: #777; border: 1px solid #333; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">FULL MARK EXAM</div>
        <div id="timer-box" class="hidden"><i class="fa-solid fa-clock"></i> <span id="timer">00:00</span></div>
    </nav>

    <div class="container">
        <div id="home">
            <h2 style="text-align: center;">لوحة التحكم</h2>
            <div class="grid">
                <div class="card" onclick="showChapters('biology')"><i class="fa-solid fa-dna"></i><h3>الأحياء</h3></div>
                <div class="card" onclick="showChapters('physics')"><i class="fa-solid fa-atom"></i><h3>الفيزياء</h3></div>
                <div class="card" onclick="showChapters('chemistry')"><i class="fa-solid fa-flask"></i><h3>الكيمياء</h3></div>
            </div>
        </div>

        <div id="chapter-list" class="hidden">
            <button class="back-btn" onclick="showHome()"> <i class="fa-solid fa-arrow-right"></i> رجوع</button>
            <h2 id="subject-title"></h2>
            <div id="chapters-container"></div>
        </div>

        <div id="exam-screen" class="hidden">
            <div class="exam-box">
                <h3 id="q-text">السؤال يظهر هنا...</h3>
                <div id="options-container"></div>
                <button class="btn" onclick="submitAnswer()">التالي</button>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <div class="exam-box" style="text-align: center;">
                <h2>انتهى الامتحان</h2>
                <h1 id="score-text" style="color: var(--secondary);">0 / 0</h1>
                <div id="review-area" style="text-align: right; margin-top: 20px;"></div>
                <button class="btn" onclick="showHome()">العودة للرئيسية</button>
            </div>
        </div>
    </div>

    <script src="logic.js"></script>
    </body>
</html>
