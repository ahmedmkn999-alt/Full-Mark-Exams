<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --accent-color: #bb86fc; --secondary-color: #03dac6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; }
        .navbar { background: #1f1f1f; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 2px solid #333; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }
        .container { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .hidden { display: none !important; }
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: var(--card-bg); border: 1px solid #333; padding: 25px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .categories-container { display: flex; justify-content: center; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
        .cat-card { background: #252525; width: 180px; padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .cat-card:hover { border-color: var(--accent-color); }
        .file-item { background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-action { background: var(--secondary-color); color: #000; padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .back-btn { background: transparent; color: #aaa; border: 1px solid #555; padding: 8px 20px; cursor: pointer; border-radius: 5px; margin-bottom: 20px; }
        .exam-area { background: var(--card-bg); padding: 30px; border-radius: 15px; }
        .option-label { display: block; background: #333; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> Full Mark</div>
    </nav>

    <div class="container">
        <div id="view-home">
            <h1 style="text-align: center;">اختر المادة</h1>
            <div class="subjects-grid">
                <div class="card" onclick="openSubject('biology')"><i class="fa-solid fa-dna fa-3x"></i><h3>الأحياء</h3></div>
                <div class="card" onclick="openSubject('arabic')"><i class="fa-solid fa-book-open fa-3x"></i><h3>اللغة العربية</h3></div>
                <div class="card" onclick="openSubject('physics')"><i class="fa-solid fa-atom fa-3x"></i><h3>الفيزياء</h3></div>
                <div class="card" onclick="openSubject('chemistry')"><i class="fa-solid fa-flask fa-3x"></i><h3>الكيمياء</h3></div>
                <div class="card" onclick="openSubject('history')"><i class="fa-solid fa-scroll fa-3x"></i><h3>التاريخ</h3></div>
                <div class="card" onclick="openSubject('math')"><i class="fa-solid fa-calculator fa-3x"></i><h3>الرياضيات</h3></div>
            </div>
        </div>

        <div id="view-dashboard" class="hidden">
            <button class="back-btn" onclick="goHome()">رجوع</button>
            <h1 id="dashboard-title" style="text-align: center;"></h1>
            <div class="categories-container">
                <div class="cat-card" onclick="alert('قريباً...')"><h3>الكتب</h3></div>
                <div class="cat-card" onclick="alert('قريباً...')"><h3>الملخصات</h3></div>
                <div class="cat-card" onclick="loadExamsList()"><h3>الامتحانات</h3></div>
            </div>
        </div>

        <div id="view-list" class="hidden">
            <button class="back-btn" onclick="goBackToDash()">رجوع</button>
            <h2 id="list-title"></h2>
            <ul id="list-items" style="list-style:none; padding:0;"></ul>
        </div>

        <div id="view-exam" class="hidden">
            <div class="exam-area">
                <div style="display:flex; justify-content:space-between;">
                    <span id="exam-name-header"></span>
                    <span id="timer-display" style="color:red; font-weight:bold;">00:00</span>
                </div>
                <div id="question-container" style="margin-top:20px;"></div>
                <button onclick="nextQuestion()" style="width:100%; padding:15px; background:var(--accent-color); border:none; border-radius:5px; cursor:pointer; font-weight:bold; margin-top:20px;">التالي</button>
            </div>
        </div>

        <div id="view-result" class="hidden" style="text-align: center;">
            <h1>النتيجة: <span id="final-score"></span></h1>
            <p id="result-message"></p>
            <button class="btn-action" onclick="goBackToDash()">العودة</button>
        </div>
    </div>

    <script> let currentSubject = ''; function goHome(){ location.reload(); } </script>
    <script src="biology.js"></script>
    <script src="exams.js"></script>
    <script>
        function openSubject(sub) {
            currentSubject = sub;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('dashboard-title').innerText = "مادة " + sub;
        }
        function goBackToDash() {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-exam').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
        }
    </script>
</body>
</html>
