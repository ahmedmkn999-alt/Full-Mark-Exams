<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark Exam | الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Readex Pro', sans-serif; background-color: #020617; }
        .subject-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer; }
        .subject-card:hover { transform: translateY(-5px); border-color: #fbbf24; box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.2); }
    </style>
</head>
<body class="text-white min-h-screen">
    <nav class="p-6 max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl md:text-3xl font-bold text-amber-500 tracking-tighter">FULL MARK EXAM</h1>
        <div class="text-[10px] md:text-xs text-slate-500 border border-slate-800 px-3 py-1 rounded-full uppercase">Edition 2026</div>
    </nav>

    <header class="text-center py-10 md:py-20 px-4">
        <h2 class="text-4xl md:text-6xl font-bold mb-4">يلا امتحن <span class="text-amber-500">دلوقتي</span> 🔥</h2>
        <p class="text-slate-400 text-sm md:text-base">اختر المادة وابدأ طريقك نحو الدرجة النهائية</p>
    </header>

    <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8 pb-20">
        <div onclick="goToExams('arabic')" class="subject-card p-6 md:p-10 rounded-[2rem] text-center">
            <div class="text-5xl mb-4">📖</div>
            <h3 class="text-xl md:text-2xl font-bold">اللغة العربية</h3>
        </div>
        <div onclick="goToExams('english')" class="subject-card p-6 md:p-10 rounded-[2rem] text-center">
            <div class="text-5xl mb-4">🇬🇧</div>
            <h3 class="text-xl md:text-2xl font-bold">English</h3>
        </div>
        <div onclick="goToExams('biology')" class="subject-card p-6 md:p-10 rounded-[2rem] text-center border-amber-500/40 shadow-lg shadow-amber-500/5">
            <div class="text-5xl mb-4">🧬</div>
            <h3 class="text-xl md:text-2xl font-bold">الأحياء</h3>
        </div>
        <div onclick="goToExams('physics')" class="subject-card p-6 md:p-10 rounded-[2rem] text-center">
            <div class="text-5xl mb-4">⚡</div>
            <h3 class="text-xl md:text-2xl font-bold">الفيزياء</h3>
        </div>
        <div onclick="goToExams('chemistry')" class="subject-card p-6 md:p-10 rounded-[2rem] text-center">
            <div class="text-5xl mb-4">🧪</div>
            <h3 class="text-xl md:text-2xl font-bold">الكيمياء</h3>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
