<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0;
            --accent-color: #bb86fc; --secondary-color: #03dac6; --danger-color: #cf6679;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; }
        
        /* Navbar */
        .navbar { background: #1f1f1f; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 2px solid #333; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }
        
        /* Containers */
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .hidden { display: none !important; }
        
        /* Home Grid */
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: var(--card-bg); border: 1px solid #333; padding: 25px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .icon-large { font-size: 3rem; margin-bottom: 15px; color: var(--secondary-color); }

        /* Dashboard & Lists */
        .categories-container { display: flex; justify-content: center; gap: 30px; margin-top: 40px; flex-wrap: wrap; }
        .cat-card { background: #252525; width: 200px; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .cat-card:hover { border-color: var(--accent-color); transform: scale(1.05); }
        
        /* File List Items */
        .file-list { list-style: none; padding: 0; }
        .file-item { background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid var(--secondary-color); }
        .btn-action { background: var(--secondary-color); color: #000; padding: 5px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Back Button */
        .back-btn { background: transparent; color: #aaa; border: 1px solid #555; padding: 8px 20px; cursor: pointer; border-radius: 5px; margin-bottom: 20px; }
        
        /* Exam Specific Styles */
        .exam-area { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 15px; }
        .option-label { display: block; background: #333; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; }
        .option-label:hover { background: #444; }
        .timer-box { font-size: 1.5rem; color: var(--danger-color); float: left; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> Full Mark</div>
        <div>منصة الثانوية العامة</div>
    </nav>

    <div class="container">
        
        <div id="view-home">
            <h1 style="text-align: center;">اختر المادة</h1>
            <div class="subjects-grid" id="subjects-container">
                <div class="card" onclick="openSubject('biology')"><div class="icon-large"><i class="fa-solid fa-dna"></i></div><h3>الأحياء</h3></div>
                <div class="card" onclick="openSubject('arabic')"><div class="icon-large"><i class="fa-solid fa-book-open"></i></div><h3>اللغة العربية</h3></div>
                <div class="card" onclick="openSubject('physics')"><div class="icon-large"><i class="fa-solid fa-atom"></i></div><h3>الفيزياء</h3></div>
                <div class="card" onclick="openSubject('chemistry')"><div class="icon-large"><i class="fa-solid fa-flask"></i></div><h3>الكيمياء</h3></div>
                <div class="card" onclick="openSubject('history')"><div class="icon-large"><i class="fa-solid fa-scroll"></i></div><h3>التاريخ</h3></div>
                <div class="card" onclick="openSubject('english')"><div class="icon-large"><i class="fa-solid fa-language"></i></div><h3>اللغة الإنجليزية</h3></div>
            </div>
        </div>

        <div id="view-dashboard" class="hidden">
            <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
            <h1 id="dashboard-title" style="text-align: center;"></h1>
            
            <div class="categories-container">
                <div class="cat-card" onclick="loadBooks()">
                    <i class="fa-solid fa-book fa-3x" style="color:var(--accent-color)"></i>
                    <h3>الكتب</h3>
                </div>
                <div class="cat-card" onclick="loadSummaries()">
                    <i class="fa-solid fa-file-pen fa-3x" style="color:var(--accent-color)"></i>
                    <h3>الملخصات</h3>
                </div>
                <div class="cat-card" onclick="loadExamsList()">
                    <i class="fa-solid fa-stopwatch fa-3x" style="color:var(--accent-color)"></i>
                    <h3>الامتحانات</h3>
                </div>
            </div>
        </div>

        <div id="view-list" class="hidden">
            <button class="back-btn" onclick="goBackToDash()"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
            <h2 id="list-title"></h2>
            <ul class="file-list" id="list-items"></ul>
        </div>

        <div id="view-exam" class="hidden">
            <button class="back-btn" onclick="exitExam()"><i class="fa-solid fa-arrow-right"></i> خروج</button>
            <div class="exam-area">
                <div style="overflow: hidden; margin-bottom: 20px;">
                    <span id="exam-name-header" style="font-weight: bold;"></span>
                    <div class="timer-box" id="timer-display">00:00</div>
                </div>
                <div id="question-container"></div>
                <button onclick="nextQuestion()" style="width:100%; padding:15px; margin-top:20px; background:var(--accent-color); border:none; border-radius:5px; cursor:pointer; font-weight:bold;">التالي</button>
            </div>
        </div>

        <div id="view-result" class="hidden" style="text-align: center; margin-top: 50px;">
            <h1>النتيجة النهائية</h1>
            <div style="font-size: 4rem; color: var(--secondary-color);" id="final-score"></div>
            <p id="result-message"></p>
            <button class="back-btn" onclick="goBackToDash()">عودة للقائمة</button>
        </div>

    </div>

    <script src="books.js"></script>
    <script src="summaries.js"></script>
    <script src="exams.js"></script>

    <script>
        // كود التنقل الأساسي
        let currentSubject = '';

        function openSubject(sub) {
            currentSubject = sub;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('dashboard-title').innerText = "لوحة مادة: " + getSubjectName(sub);
        }

        function goHome() {
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');
        }

        function goBackToDash() {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-exam').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
        }

        function getSubjectName(code) {
            const names = { 'biology': 'الأحياء', 'arabic': 'اللغة العربية', 'physics': 'الفيزياء', 'chemistry': 'الكيمياء', 'history': 'التاريخ', 'english': 'الغة الإنجليزية' };
            return names[code] || code;
        }
    </script>
</body>
                </html>
