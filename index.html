<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Mark Exam | الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Readex Pro', sans-serif; background-color: #020617; }
        .subject-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .subject-card:hover { transform: translateY(-5px); border-color: #fbbf24; }
    </style>
</head>
<body class="text-white">
    <nav class="p-6 max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-3xl font-bold text-amber-500 tracking-tighter">FULL MARK EXAM</h1>
        <span class="bg-amber-500/10 text-amber-500 px-4 py-1 rounded-full text-xs font-bold">2026 EDITION</span>
    </nav>

    <header class="text-center py-16">
        <h2 class="text-5xl font-bold mb-4 text-white">يلا امتحن <span class="text-amber-500">دلوقتي</span> 🔥</h2>
        <p class="text-slate-400">اختر المادة وابدأ طريقك نحو الدرجة النهائية</p>
    </header>

    <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 pb-20">
        <div class="subject-card p-8 rounded-3xl text-center">
            <div class="text-5xl mb-4">🧬</div>
            <h3 class="text-2xl font-bold mb-2">الأحياء</h3>
            <p class="text-slate-400 text-sm mb-6">امتحان شامل على الدعامة والحركة</p>
            <button onclick="startBiology()" class="w-full py-3 bg-amber-500 text-slate-900 font-bold rounded-xl hover:bg-amber-400">ابدأ الامتحان</button>
        </div>
        </div>

    <script src="main.js"></script>
</body>
</html>
